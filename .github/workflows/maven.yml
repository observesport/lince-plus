name: Java CI with Maven

# Staged release pipeline:
#
#   build -> test -> bundle-installer -> deploy -> publish-installer -> update-docs
#   build-site (independent, every branch) ----------------------^
#
# How far a run goes depends on where it runs:
#
#   feature branches / PRs  build + test + build-site
#   develop                 ... + bundle-installer (verified, not uploaded)
#   master (non-SNAPSHOT)   ... + deploy + publish-installer + update-docs
#
# Every stage depends on the previous one, so docs can never go live before
# the installers they advertise exist. `update-docs` additionally sits behind
# a protected environment (manual approval) and re-verifies via the API that
# the release is published with all four installers attached before it runs.
#
# The website is an Astro project under site/. `build-site` builds it on every
# push so a broken site fails a PR, and uploads the result as the Pages
# artifact; `update-docs` only deploys that artifact once the release is
# verified.
#
# NOTE: GitHub's automatic "pages build and deployment" must be turned OFF for
# the docs gate to mean anything. See docs/CI.md for the one-time repo setting.

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:
    inputs:
      preview:
        description: 'Deploy the website to a temporary surge.sh URL'
        type: boolean
        default: false
      keep_preview:
        description: 'Keep the surge.sh preview alive (skip teardown)'
        type: boolean
        default: false

concurrency:
  # Release runs must never be cancelled midway, or a release can end up with
  # assets half-published. Feature branches and PRs are cheap to redo, so
  # superseded runs there are cancelled - this also collapses the duplicate
  # run a PR branch gets from `push` and `pull_request` firing together.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. BUILD - compile the reactor and resolve the version. No side effects.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    environment:
      name: cicd
    permissions:
      contents: read
      packages: read
    outputs:
      FULL_VERSION: ${{ steps.get_version.outputs.FULL_VERSION }}
      CLEAN_VERSION: ${{ steps.get_version.outputs.CLEAN_VERSION }}
      FILE_VERSION: ${{ steps.get_version.outputs.FILE_VERSION }}
      FULL_FILE_VERSION: ${{ steps.get_version.outputs.FULL_FILE_VERSION }}
      IS_RELEASE: ${{ steps.get_version.outputs.IS_RELEASE }}
      IS_DEVELOP: ${{ steps.get_version.outputs.IS_DEVELOP }}
    steps:
      - uses: actions/checkout@v4

      # server-id wires up ~/.m2/settings.xml. The root pom lists GitHub
      # Packages as a resolution repository, so Maven needs credentials for it
      # even on a read-only build.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'liberica'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Get version
        id: get_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FULL_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f src/pom.xml)
          CLEAN_VERSION=${FULL_VERSION%-SNAPSHOT}
          FILE_VERSION=${CLEAN_VERSION//./_}
          FULL_FILE_VERSION=${FULL_VERSION//./_}

          # Tier the run by branch. On pull_request GITHUB_REF is
          # refs/pull/N/merge, so neither flag is ever set for a PR - a PR only
          # ever gets build + test, even when it targets master.
          IS_RELEASE=false
          IS_DEVELOP=false
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            # A release is a non-SNAPSHOT version sitting on master.
            if [[ "$FULL_VERSION" != *SNAPSHOT* && "$GITHUB_REF" == "refs/heads/master" ]]; then
              IS_RELEASE=true
            fi
            if [ "$GITHUB_REF" = "refs/heads/develop" ]; then
              IS_DEVELOP=true
            fi
          fi

          {
            echo "FULL_VERSION=$FULL_VERSION"
            echo "CLEAN_VERSION=$CLEAN_VERSION"
            echo "FILE_VERSION=$FILE_VERSION"
            echo "FULL_FILE_VERSION=$FULL_FILE_VERSION"
            echo "IS_RELEASE=$IS_RELEASE"
            echo "IS_DEVELOP=$IS_DEVELOP"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Version"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Project version | \`$FULL_VERSION\` |"
            echo "| Installer file version | \`$FULL_FILE_VERSION\` |"
            echo "| Release build | \`$IS_RELEASE\` |"
            echo "| Develop build | \`$IS_DEVELOP\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build with Maven
        run: cd src && mvn -B --update-snapshots -Plocal package -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 2. TEST - run the unit test suite. Runs on every branch and PR, and gates
  #    everything downstream: no installer is bundled from failing code.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cicd
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'liberica'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Run tests
        run: cd src && mvn -B -Plocal test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          include_passed: true
          detailed_summary: true
          fail_on_failure: true

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: '**/target/surefire-reports/**'

  # ---------------------------------------------------------------------------
  # 3. BUNDLE INSTALLER - run Install4j and verify all four artifacts exist.
  #    Develop and master only; feature branches and PRs stop after `test`.
  # ---------------------------------------------------------------------------
  bundle-installer:
    name: Bundle installer
    needs: [ build, test ]
    if: needs.build.outputs.IS_RELEASE == 'true' || needs.build.outputs.IS_DEVELOP == 'true'
    runs-on: ubuntu-latest
    environment:
      name: cicd
    permissions:
      contents: read
      packages: read
    env:
      FULL_FILE_VERSION: ${{ needs.build.outputs.FULL_FILE_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'liberica'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Download and setup Install4j
        run: |
          wget -q https://download.ej-technologies.com/install4j/install4j_linux-x64_10_0_9.deb
          sudo dpkg -i install4j_linux-x64_10_0_9.deb
          echo "INSTALL4J_HOME=/opt/install4j10" >> "$GITHUB_ENV"

      - name: Build installers
        run: |
          cd src
          mvn -B package install --update-snapshots -DskipTests \
            -DinstallDir="${INSTALL4J_HOME}" \
            -Dinstall4j.licenseKey="${{ secrets.INSTALL4J_LICENSE_KEY }}"
        env:
          INSTALL4J_HOME: "/opt/install4j10"
          INSTALL4J_LICENSE: ${{ secrets.INSTALL4J_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display output.txt
        if: always()
        run: |
          if [ -f src/installer/output.txt ]; then
            echo "Contents of output.txt:"
            cat src/installer/output.txt
          else
            echo "output.txt file not found in src/installer/"
          fi

      - name: Verify installer files
        run: |
          MISSING=0
          for PATH_TO_CHECK in \
            "./src/installer/lince-plus_windows-x64_${FULL_FILE_VERSION}_Windows.exe" \
            "./src/installer/lince-plus_macos_${FULL_FILE_VERSION}_mac-arm.dmg" \
            "./src/installer/lince-plus_macos_${FULL_FILE_VERSION}_mac-x86.dmg" \
            "./src/installer/lince-plus_unix_${FULL_FILE_VERSION}_linux-x64.sh" ; do
            if [ -f "$PATH_TO_CHECK" ]; then
              echo "Found: $PATH_TO_CHECK"
            else
              echo "::error::Installer file not found: $PATH_TO_CHECK"
              MISSING=$((MISSING+1))
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING installer file(s) are missing."
            ls -R ./src/installer/
            exit 1
          fi

      # Release runs only. On develop the installers are built and verified but
      # deliberately not uploaded - the build proves they can be produced, and
      # nothing downstream consumes them.
      - name: Upload installers
        if: needs.build.outputs.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lince-plus-installers-${{ env.FULL_FILE_VERSION }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ./src/installer/lince-plus_windows-x64_${{ env.FULL_FILE_VERSION }}_Windows.exe
            ./src/installer/lince-plus_macos_${{ env.FULL_FILE_VERSION }}_mac-arm.dmg
            ./src/installer/lince-plus_macos_${{ env.FULL_FILE_VERSION }}_mac-x86.dmg
            ./src/installer/lince-plus_unix_${{ env.FULL_FILE_VERSION }}_linux-x64.sh

  # ---------------------------------------------------------------------------
  # 4. DEPLOY - push artifacts to GitHub Packages. Release builds only.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Packages
    needs: [ build, test, bundle-installer ]
    if: needs.build.outputs.IS_RELEASE == 'true'
    runs-on: ubuntu-latest
    environment:
      name: cicd
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'liberica'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Deploy
        run: cd src && mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 5. PUBLISH INSTALLER - attach installers to the release and publish it.
  # ---------------------------------------------------------------------------
  publish-installer:
    name: Publish installer
    needs: [ build, test, bundle-installer, deploy ]
    if: needs.build.outputs.IS_RELEASE == 'true'
    runs-on: ubuntu-latest
    environment:
      name: cicd
    permissions:
      contents: write
    env:
      FULL_VERSION: ${{ needs.build.outputs.FULL_VERSION }}
      FULL_FILE_VERSION: ${{ needs.build.outputs.FULL_FILE_VERSION }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: lince-plus-installers-${{ env.FULL_FILE_VERSION }}
          path: ./installers

      - name: List downloaded installers
        run: ls -lh ./installers

      - name: Publish release with assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.FULL_VERSION }}
          name: Release ${{ env.FULL_VERSION }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ./installers/lince-plus_windows-x64_${{ env.FULL_FILE_VERSION }}_Windows.exe
            ./installers/lince-plus_macos_${{ env.FULL_FILE_VERSION }}_mac-arm.dmg
            ./installers/lince-plus_macos_${{ env.FULL_FILE_VERSION }}_mac-x86.dmg
            ./installers/lince-plus_unix_${{ env.FULL_FILE_VERSION }}_linux-x64.sh

  # ---------------------------------------------------------------------------
  # BUILD SITE - build the Astro website under site/ and upload it as the
  #    GitHub Pages artifact. Runs on every branch and PR, independently of the
  #    Maven reactor, so a broken site is caught before it reaches master.
  #    Nothing is deployed here; `update-docs` deploys this artifact.
  # ---------------------------------------------------------------------------
  build-site:
    name: Build website
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  # ---------------------------------------------------------------------------
  # VALIDATE SITE - token-free check of the exact artifact `update-docs` will
  #    deploy. Downloads the Pages artifact, serves it on the runner under the
  #    production base path, runs the smoke test, and stops the server again.
  #    Needs nothing beyond the default GITHUB_TOKEN. Runs on every branch/PR.
  # ---------------------------------------------------------------------------
  validate-site:
    name: Validate website
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact

      - name: Unpack under the production base path
        run: |
          mkdir -p www/lince-plus
          tar -xf pages-artifact/artifact.tar -C www/lince-plus
          echo "Files:" && find www -type f | wc -l

      - name: Serve
        run: |
          python3 -m http.server 8080 --directory www > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8080/lince-plus/ && break
            sleep 1
          done

      - name: Smoke test
        run: site/scripts/smoke.sh http://localhost:8080/lince-plus

      - name: Teardown
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" 2>/dev/null || true; fi
          rm -rf www pages-artifact server.pid
          echo "Local preview server stopped and files removed."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Website validation"
            echo ""
            echo "The \`github-pages\` artifact of this run was served locally and smoke-tested."
            echo ""
            echo "To browse it yourself: download the artifact from this run, then"
            echo '```'
            echo "mkdir -p www/lince-plus && tar -xf artifact.tar -C www/lince-plus"
            echo "python3 -m http.server 8080 --directory www   # http://localhost:8080/lince-plus/"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # PREVIEW SITE (optional) - publish the website to a temporary surge.sh URL,
  #    smoke-test it there, and tear it down again in `preview-teardown`.
  #
  #    Opt-in: only does anything when the SURGE_TOKEN secret exists. Runs on
  #    pull requests, or on a manual run with the `preview` input ticked.
  #    The site is rebuilt with SITE_BASE=/ because surge serves it from the
  #    root of its own host, not under /lince-plus.
  # ---------------------------------------------------------------------------
  preview-site:
    name: Preview website (surge.sh)
    needs: build-site
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.preview)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: site-preview
      url: ${{ steps.domain.outputs.url }}
    env:
      SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
    outputs:
      domain: ${{ steps.domain.outputs.domain }}
      deployed: ${{ steps.deploy.outcome == 'success' }}
    defaults:
      run:
        working-directory: site
    steps:
      # Runs before checkout, so site/ does not exist yet: use the workspace.
      - name: Check SURGE_TOKEN
        if: env.SURGE_TOKEN == ''
        working-directory: ${{ github.workspace }}
        run: |
          echo "::notice::SURGE_TOKEN is not set - skipping the surge.sh preview. Add the secret to enable it (see docs/CI.md)."

      - uses: actions/checkout@v4
        if: env.SURGE_TOKEN != ''

      - name: Set up Node
        if: env.SURGE_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      # One stable domain per PR (redeploys overwrite it) or per branch.
      - name: Resolve preview domain
        if: env.SURGE_TOKEN != ''
        id: domain
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SLUG="pr${{ github.event.pull_request.number }}"
          else
            SLUG="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)"
          fi
          DOMAIN="lince-plus-${SLUG}.surge.sh"
          {
            echo "domain=$DOMAIN"
            echo "url=https://$DOMAIN"
          } >> "$GITHUB_OUTPUT"
          echo "Preview domain: https://$DOMAIN"

      - name: Install dependencies
        if: env.SURGE_TOKEN != ''
        run: npm ci

      - name: Build site for the preview host
        if: env.SURGE_TOKEN != ''
        env:
          SITE_URL: ${{ steps.domain.outputs.url }}
          SITE_BASE: /
        run: npm run build

      - name: Deploy to surge.sh
        if: env.SURGE_TOKEN != ''
        id: deploy
        run: npx --yes surge ./dist "${{ steps.domain.outputs.domain }}" --token "$SURGE_TOKEN"

      - name: Validate the preview
        if: env.SURGE_TOKEN != ''
        run: scripts/smoke.sh "${{ steps.domain.outputs.url }}"

      - name: Summary
        if: env.SURGE_TOKEN != ''
        run: |
          {
            echo "### Website preview"
            echo ""
            echo "- URL: ${{ steps.domain.outputs.url }}"
            echo "- Smoke test: passed"
            if [ "${{ inputs.keep_preview }}" = "true" ]; then
              echo "- Teardown: skipped (keep_preview). Remove it later with a manual run, or: \`npx surge teardown ${{ steps.domain.outputs.domain }}\`"
            else
              echo "- Teardown: runs in the \`preview-teardown\` job once validation is done"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # PREVIEW TEARDOWN - remove the temporary surge.sh site after validation.
  #
  #    Runs whenever a preview was deployed, even if the smoke test failed, so
  #    nothing is left behind. Skipped when a manual run asked to keep it.
  #    The `site-preview-teardown` environment is optional: give it a required
  #    reviewer and the teardown waits for a human to sign the preview off.
  # ---------------------------------------------------------------------------
  preview-teardown:
    name: Teardown website preview
    needs: preview-site
    if: >-
      always() &&
      needs.preview-site.outputs.deployed == 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.keep_preview)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: site-preview-teardown
    env:
      SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
      DOMAIN: ${{ needs.preview-site.outputs.domain }}
    steps:
      - name: Tear down surge.sh preview
        run: |
          npx --yes surge teardown "$DOMAIN" --token "$SURGE_TOKEN"
          echo "Removed https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 6. UPDATE DOCS - website + lince-version.json (the in-app update trigger).
  #
  # Gated twice:
  #   a) the `docs-release` environment requires a manual reviewer approval
  #   b) after approval, the release is re-verified as published with all four
  #      installers attached - otherwise the job fails and docs stay untouched
  # ---------------------------------------------------------------------------
  update-docs:
    name: Update docs
    needs: [ build, build-site, validate-site, publish-installer ]
    if: needs.build.outputs.IS_RELEASE == 'true'
    runs-on: ubuntu-latest
    environment:
      name: docs-release
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      FULL_VERSION: ${{ needs.build.outputs.FULL_VERSION }}
      FULL_FILE_VERSION: ${{ needs.build.outputs.FULL_FILE_VERSION }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Hard safety net. Even with approval, refuse to publish docs unless the
      # release really is live and carries every installer.
      - name: Verify release is published with all installers
        run: |
          TAG="v${FULL_VERSION}"
          echo "Verifying release $TAG ..."

          if ! RELEASE_JSON=$(gh release view "$TAG" --json isDraft,assets 2>/dev/null); then
            echo "::error::Release $TAG does not exist. Refusing to update docs."
            exit 1
          fi

          IS_DRAFT=$(echo "$RELEASE_JSON" | jq -r '.isDraft')
          if [ "$IS_DRAFT" != "false" ]; then
            echo "::error::Release $TAG is still a draft. Refusing to update docs."
            exit 1
          fi

          MISSING=0
          for ASSET in \
            "lince-plus_windows-x64_${FULL_FILE_VERSION}_Windows.exe" \
            "lince-plus_macos_${FULL_FILE_VERSION}_mac-arm.dmg" \
            "lince-plus_macos_${FULL_FILE_VERSION}_mac-x86.dmg" \
            "lince-plus_unix_${FULL_FILE_VERSION}_linux-x64.sh" ; do
            if echo "$RELEASE_JSON" | jq -e --arg a "$ASSET" '.assets[] | select(.name == $a)' > /dev/null; then
              echo "Asset present: $ASSET"
            else
              echo "::error::Release asset missing: $ASSET"
              MISSING=$((MISSING+1))
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING release asset(s) missing. Refusing to update docs."
            exit 1
          fi

          echo "Release $TAG is published with all installers."

      # lince-version.json is polled by the desktop app to advertise updates,
      # so it must agree with the version that was just published.
      - name: Verify lince-version.json matches the release
        run: |
          JSON_VERSION=$(jq -r '.version' lince-version.json)
          if [ "$JSON_VERSION" != "$FULL_VERSION" ]; then
            echo "::error::lince-version.json says '$JSON_VERSION' but this release is '$FULL_VERSION'."
            echo "::error::Update lince-version.json before releasing, or the in-app update check will be wrong."
            exit 1
          fi
          echo "lince-version.json matches the release: $JSON_VERSION"

      # The site itself was built and uploaded by `build-site` in this same
      # run, from the same commit. Only the deployment happens here.
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          {
            echo "### Docs published"
            echo ""
            echo "Release \`v${FULL_VERSION}\` was verified as published with all four installers."
            echo ""
            echo "- Site: ${{ steps.pages.outputs.page_url }}"
            echo "- \`lince-version.json\` now advertises \`${FULL_VERSION}\` to the desktop app."
          } >> "$GITHUB_STEP_SUMMARY"
