# Manual check that the Partner Center credentials in the repository secrets
# can reach the Microsoft Store: `gh workflow run store-check.yml --ref <branch>`.
name: Store check
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: microsoft/microsoft-store-apppublisher@v1.4
      - name: List Store apps
        env:
          MS_PARTNER_CENTER_TENANT_ID: ${{ secrets.MS_PARTNER_CENTER_TENANT_ID }}
          MS_PARTNER_CENTER_SELLER_ID: ${{ secrets.MS_PARTNER_CENTER_SELLER_ID }}
          MS_PARTNER_CENTER_CLIENT_ID: ${{ secrets.MS_PARTNER_CENTER_CLIENT_ID }}
          MS_PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.MS_PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId "$MS_PARTNER_CENTER_TENANT_ID" --sellerId "$MS_PARTNER_CENTER_SELLER_ID" --clientId "$MS_PARTNER_CENTER_CLIENT_ID" --clientSecret "$MS_PARTNER_CENTER_CLIENT_SECRET"
          msstore apps list --output-stream stdout
